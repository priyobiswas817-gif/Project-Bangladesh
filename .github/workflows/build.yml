name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Extract and Find Project
        run: |
          unzip -o PRIYO_CODEX.zip || true
          # gradlew ফাইল কোথায় আছে তা খুঁজে মূল জায়গায় কপি করে আনা
          GRADLE_DIR=$(find . -name "gradlew" -exec dirname {} \;)
          echo "PROJECT_DIR=$GRADLE_DIR" >> $GITHUB_ENV

      - name: Build APK
        run: |
          cd ${{ env.PROJECT_DIR }}
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: '**/build/outputs/apk/debug/*.apk'
